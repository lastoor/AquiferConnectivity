data_root: /project2/fbarros_324/binhaoli/task8_rMin_tMin/FastMarchingMethod
run_id: 3
length_scale: 0.05
dh: 0.1
field_size_ref: 200
k_g: 1.0
analytical_percentile: 0.01

variance_values: [0.1, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5]
